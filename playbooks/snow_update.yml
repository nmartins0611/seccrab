---
- hosts: localhost
  gather_facts: false
  connection: httpapi
  vars:
    ansible_httpapi_port: 443
    ansible_httpapi_use_ssl: true
    ansible_httpapi_validate_certs: false
    SN_HOST:
    SN_USERNAME:
    SN_PASSWORD:
    advisory_id:
    incident_number: CHG0031892


  vars_files:
   - insights
    
  tasks:

   - name: Gather CVE details
     ansible.builtin.uri:
       url: "https://console.redhat.com/api/patch/v3/advisories/RHSA-2024:4779"
       method: GET
       url_username: "{{ insights_username }}"
       url_password: "{{ insights_password }}"
       force_basic_auth: true
       status_code: 200
     register: cve_details

   - name: Retrieve related CVEs from Advisories
     ansible.builtin.uri:
      url: "https://console.redhat.com/api/patch/v3/advisories/{{ advisory_id }}/systems?page=1&perPage=20&sort=-last_upload&offset=0&limit=20"
      method: GET
      url_username: "{{ insights_username }}"
      url_password: "{{ insights_password }}"
      force_basic_auth: true
      status_code: 200
     register: cves_list

   - name: Extract display names
     ansible.builtin.set_fact:
       affected_systems: "{{ cves_list.json.data | map(attribute='attributes.display_name') | list }}"

   - name: Extract type
     ansible.builtin.set_fact:
       cve_type: "{{ cve_details.json.data.attributes.advisory_type_name }}"
      
   - name: Extract cve
     ansible.builtin.set_fact:
       cves: "{{ cve_details.json.data.attributes.cves }}"

   - name: Extract Severityity
     ansible.builtin.set_fact:
       sev: "{{ cve_details.json.data.attributes.severity }}"

   - name: Extract description
     ansible.builtin.set_fact:
       cves_description: "{{ cve_details.json.data.attributes.description }}"

   - name: Extract Insights URL
     ansible.builtin.set_fact:
       insights_url: "{{ cve_details.json.data.attributes.description }}"

   - name: Extract Solution
     ansible.builtin.set_fact:
       solution: "{{ cve_details.json.data.attributes.solution }}"

   - name: Extract Topic
     ansible.builtin.set_fact:
       topic: "{{ cve_details.json.data.attributes.topic }}"

   - name: Extract display names with dev tags
     set_fact:
       display_dev: "{{ cves_list.json.data | json_query('[?attributes.tags[?value==`dev`]].attributes.display_name')}}"

   - name: Extract display names with prod tags
     set_fact:
       display_prod: "{{ cves_list.json.data | json_query('[?attributes.tags[?value==`prod-tx`]].attributes.display_name')}}"


   - name: Close the ServiceNow Change Request
     servicenow.itsm.change_request:
      instance:      
       host: "{{ SN_HOST }}"
       username: "{{ SN_USERNAME }}"
       password: "{{ SN_PASSWORD }}"   
      number: "{{ incident_number }}"
      close_code: "successful"
      close_notes: |
        Remediated Development Systems: "{{ display_dev }}"
        Remediated Production Systems: "{{  display_prod }}"
        Total Affected systems: "{{ affected_systems }}"
        CVE: Resolved - "{{ cves }}"
      state: closed
